<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Log</title>
<style>
  :root{
    --ink:#1c1f1a;
    --paper:#fbfaf6;
    --line:#d8d4c8;
    --line-soft:#e9e6dc;
    --moss:#4b5a3a;
    --moss-dark:#38452a;
    --rust:#a4522a;
    --amber:#c98a2b;
    --row-alt:#f3f1e8;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Georgia","Times New Roman",serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2.5rem 1rem 4rem;
  }
  .wrap{
    width:100%;
    max-width:1080px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:0.9rem;
    margin-bottom:0.9rem;
    gap:1rem;
    flex-wrap:wrap;
  }
  h1{
    font-size:1.9rem;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .subtitle{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:0.82rem;
    color:#6b6a5f;
    margin-top:0.3rem;
  }
  .status{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:0.78rem;
    color:#6b6a5f;
    text-align:right;
    min-width:150px;
  }
  .status .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--moss);
    margin-right:0.4em;
  }

  .user-bar{
    display:flex;
    gap:1.6rem;
    flex-wrap:wrap;
    margin-bottom:1.4rem;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .user-bar label{
    font-size:0.72rem;
    letter-spacing:0.03em;
    color:#8a8878;
    display:flex;
    flex-direction:column;
    gap:0.25rem;
  }
  .user-bar input{
    font-family:"Iowan Old Style","Georgia",serif;
    font-size:0.95rem;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:0.2rem 0.1rem;
    outline:none;
    color:var(--ink);
    min-width:160px;
  }
  .user-bar input:focus{ border-bottom-color:var(--amber); }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:0.6rem;
    margin-bottom:1rem;
    align-items:center;
  }
  .toolbar .spacer{ flex:1 1 auto; }
  button{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:0.85rem;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    padding:0.55rem 1rem;
    cursor:pointer;
    border-radius:2px;
    transition:background 0.12s ease, color 0.12s ease, transform 0.05s ease;
  }
  button:hover{ background:var(--ink); color:var(--paper); }
  button:active{ transform:translateY(1px); }
  button.primary{ background:var(--moss); border-color:var(--moss); color:#fff; }
  button.primary:hover{ background:var(--moss-dark); border-color:var(--moss-dark); }
  button.ghost{ border-color:var(--line); color:#57564c; }
  button.ghost:hover{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  button.toggle{ border-color:var(--rust); color:var(--rust); background:transparent; }
  button.toggle:hover{ background:var(--rust); color:#fff; }
  button.danger-text{
    border:none;background:none;color:#a4522a;padding:0.2rem 0.4rem;font-size:0.95rem;
  }
  button.danger-text:hover{ background:#f1e2da; color:#a4522a; }

  .table-shell{
    border:1px solid var(--ink);
  }
  .table-scroll{
    max-height:55vh;
    overflow-y:auto;
    overflow-x:auto;
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width:800px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:0.88rem;
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--ink);
    color:var(--paper);
    text-align:left;
    font-weight:500;
    font-size:0.72rem;
    letter-spacing:0.03em;
    padding:0.65rem 0.7rem;
    z-index:2;
    white-space:nowrap;
  }
  thead th.col-del{ width:2.2rem; }
  tbody tr{ border-bottom:1px solid var(--line-soft); }
  tbody tr:nth-child(even){ background:var(--row-alt); }
  tbody tr:hover{ background:#eef1e6; }
  td{
    padding:0;
    border-right:1px solid var(--line-soft);
    vertical-align:top;
  }
  td:last-of-type{ border-right:none; }
  .cell{
    display:block;
    width:100%;
    min-width:100px;
    padding:0.55rem 0.7rem;
    outline:none;
    white-space:pre-wrap;
    word-break:break-word;
    min-height:1.6em;
    cursor:text;
  }
  .cell:focus{
    background:#fff8e6;
    box-shadow:inset 0 0 0 1.5px var(--amber);
  }
  .cell.empty::before{
    content:attr(data-placeholder);
    color:#a6a495;
  }
  td.time-col .cell{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .class-input{
    width:100%;
    min-width:110px;
    border:none;
    background:transparent;
    font:inherit;
    padding:0.55rem 0.7rem;
    outline:none;
  }
  .class-input:focus{
    background:#fff8e6;
    box-shadow:inset 0 0 0 1.5px var(--amber);
  }
  td.col-del{ text-align:center; }

  .empty-state{
    padding:2.2rem 1rem;
    text-align:center;
    font-family:"Helvetica Neue",Arial,sans-serif;
    color:#8a8878;
    font-size:0.88rem;
  }

  .summary{
    margin-top:1.8rem;
    border-top:2px solid var(--ink);
    padding-top:1.1rem;
  }
  .summary h2{
    font-size:1.15rem;
    margin:0 0 0.8rem;
    font-weight:600;
  }
  .summary-controls{
    display:flex;
    gap:1.2rem;
    flex-wrap:wrap;
    align-items:flex-end;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .summary-controls label{
    font-size:0.72rem;
    letter-spacing:0.03em;
    color:#8a8878;
    display:flex;
    flex-direction:column;
    gap:0.3rem;
  }
  .summary-controls select{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:0.88rem;
    padding:0.5rem 0.6rem;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    min-width:180px;
  }
  .summary-result{
    margin-top:1rem;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:0.92rem;
    padding:0.9rem 1rem;
    background:var(--row-alt);
    border-left:3px solid var(--moss);
    min-height:1.2em;
  }
  .summary-result .big{
    font-family:"Iowan Old Style","Georgia",serif;
    font-size:1.5rem;
    color:var(--moss-dark);
    display:block;
    margin-bottom:0.2rem;
  }
  .summary-result .note{
    color:#8a8878;
    font-size:0.78rem;
  }

  footer{
    margin-top:1.1rem;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:0.76rem;
    color:#8a8878;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.5rem;
  }
  #file-input{ display:none; }

  @media (max-width:600px){
    h1{ font-size:1.5rem; }
    .toolbar button{ flex:1 1 auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Time Log</h1>
      <div class="subtitle">Project hours, kept locally in this browser.</div>
    </div>
    <div class="status" id="status">
      <span class="dot"></span><span id="statusText">Loaded from this browser</span>
    </div>
  </header>

  <div class="user-bar">
    <label>First name
      <input type="text" id="firstName" placeholder="First name">
    </label>
    <label>Last name
      <input type="text" id="lastName" placeholder="Last name">
    </label>
  </div>

  <div class="toolbar">
    <button class="primary" id="btnAddRow">+ Add work event</button>
    <button class="ghost" id="btnInsertNow">Insert current date &amp; time</button>
    <button id="btnBackup">Backup to CSV</button>
    <button id="btnLoadCsv">Load from CSV</button>
    <span class="spacer"></span>
    <button class="toggle" id="btnToggleLabels">Switch to general labels</button>
    <input type="file" id="file-input" accept=".csv,text/csv">
  </div>

  <div class="table-shell">
    <div class="table-scroll" id="tableScroll">
      <table>
        <thead>
          <tr>
            <th class="col-del"></th>
            <th>Start time</th>
            <th>End time</th>
            <th id="thClass">Class</th>
            <th id="thAssignment">Assignment</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        No entries yet. Click "Add work event" to start logging.
      </div>
    </div>
  </div>

  <footer>
    <span>Click any cell to edit it directly.</span>
    <span id="rowCount">0 rows</span>
  </footer>

  <section class="summary">
    <h2 id="summaryTitle">Time spent</h2>
    <div class="summary-controls">
      <label id="filterClassLabel">Class
        <select id="filterClass"><option value="">Any</option></select>
      </label>
      <label id="filterAssignmentLabel">Assignment
        <select id="filterAssignment"><option value="">Any</option></select>
      </label>
      <button class="primary" id="btnCalc">Calculate</button>
    </div>
    <div class="summary-result" id="summaryResult">Pick a class and/or an assignment above, then calculate.</div>
  </section>
</div>

<datalist id="classesList"></datalist>
<datalist id="assignmentsList"></datalist>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "worklog_data_v1";
  var USER_KEY = "worklog_user_v1";
  var LABEL_KEY = "worklog_label_mode_v1";
  var COLUMNS = ["start","end","cls","assignment","notes"];

  var LABELS = {
    school: {
      cls:"Class", assignment:"Assignment",
      clsPlaceholder:"class", assignmentPlaceholder:"assignment",
      toggleText:"Switch to general labels",
      filterClsLabel:"Class", filterAssignmentLabel:"Assignment"
    },
    general: {
      cls:"Category", assignment:"Activity",
      clsPlaceholder:"category", assignmentPlaceholder:"activity",
      toggleText:"Switch to school labels",
      filterClsLabel:"Category", filterAssignmentLabel:"Activity"
    }
  };

  var tbody = document.getElementById("tbody");
  var tableScroll = document.getElementById("tableScroll");
  var emptyState = document.getElementById("emptyState");
  var classesList = document.getElementById("classesList");
  var assignmentsList = document.getElementById("assignmentsList");
  var rowCountEl = document.getElementById("rowCount");
  var statusText = document.getElementById("statusText");
  var fileInput = document.getElementById("file-input");
  var firstNameInput = document.getElementById("firstName");
  var lastNameInput = document.getElementById("lastName");
  var thClass = document.getElementById("thClass");
  var thAssignment = document.getElementById("thAssignment");
  var btnToggleLabels = document.getElementById("btnToggleLabels");
  var filterClassSelect = document.getElementById("filterClass");
  var filterAssignmentSelect = document.getElementById("filterAssignment");
  var filterClassLabelEl = document.getElementById("filterClassLabel");
  var filterAssignmentLabelEl = document.getElementById("filterAssignmentLabel");
  var summaryResult = document.getElementById("summaryResult");

  var data = [];          // array of {start,end,cls,assignment,notes}
  var lastFocused = null; // {rowIndex, col} of the last focused editable field
  var labelMode = "school";

  // ---------- persistence ----------

  function loadFromStorage(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) return parsed;
      }
    }catch(e){ /* ignore corrupt storage */ }
    return [];
  }

  function saveToStorage(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      statusText.textContent = "Saved in this browser";
    }catch(e){
      statusText.textContent = "Could not save (storage full or blocked)";
    }
  }

  function loadUser(){
    try{
      var raw = localStorage.getItem(USER_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        firstNameInput.value = parsed.first || "";
        lastNameInput.value = parsed.last || "";
      }
    }catch(e){ /* ignore */ }
  }

  function saveUser(){
    try{
      localStorage.setItem(USER_KEY, JSON.stringify({
        first: firstNameInput.value.trim(),
        last: lastNameInput.value.trim()
      }));
    }catch(e){ /* ignore */ }
  }

  function loadLabelMode(){
    try{
      var stored = localStorage.getItem(LABEL_KEY);
      if(stored === "school" || stored === "general") return stored;
    }catch(e){ /* ignore */ }
    return "school";
  }

  function saveLabelMode(){
    try{ localStorage.setItem(LABEL_KEY, labelMode); }catch(e){ /* ignore */ }
  }

  // ---------- label mode ----------

  function applyLabels(){
    var L = LABELS[labelMode];
    thClass.textContent = L.cls;
    thAssignment.textContent = L.assignment;
    btnToggleLabels.textContent = L.toggleText;
    filterClassLabelEl.firstChild.textContent = L.filterClsLabel + " ";
    filterAssignmentLabelEl.firstChild.textContent = L.filterAssignmentLabel + " ";
  }

  btnToggleLabels.addEventListener("click", function(){
    labelMode = (labelMode === "school") ? "general" : "school";
    saveLabelMode();
    applyLabels();
    render(true);
  });

  // ---------- user name ----------

  firstNameInput.addEventListener("blur", saveUser);
  lastNameInput.addEventListener("blur", saveUser);
  firstNameInput.addEventListener("input", saveUser);
  lastNameInput.addEventListener("input", saveUser);

  // ---------- rendering ----------

  function pad(n){ return n < 10 ? "0"+n : ""+n; }

  function formatNow(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+
           pad(d.getHours())+":"+pad(d.getMinutes());
  }

  function uniqueValues(field){
    var seen = {};
    var out = [];
    data.forEach(function(r){
      var v = (r[field]||"").trim();
      if(v && !seen[v]){ seen[v] = true; out.push(v); }
    });
    return out;
  }

  function refreshAuxLists(){
    var classes = uniqueValues("cls");
    var assignments = uniqueValues("assignment");

    classesList.innerHTML = "";
    classes.forEach(function(c){
      var opt = document.createElement("option");
      opt.value = c;
      classesList.appendChild(opt);
    });

    assignmentsList.innerHTML = "";
    assignments.forEach(function(a){
      var opt = document.createElement("option");
      opt.value = a;
      assignmentsList.appendChild(opt);
    });

    var prevClassSel = filterClassSelect.value;
    var prevAssignSel = filterAssignmentSelect.value;
    filterClassSelect.innerHTML = '<option value="">Any</option>';
    classes.forEach(function(c){
      var opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      filterClassSelect.appendChild(opt);
    });
    filterAssignmentSelect.innerHTML = '<option value="">Any</option>';
    assignments.forEach(function(a){
      var opt = document.createElement("option");
      opt.value = a; opt.textContent = a;
      filterAssignmentSelect.appendChild(opt);
    });
    if(classes.indexOf(prevClassSel) !== -1) filterClassSelect.value = prevClassSel;
    if(assignments.indexOf(prevAssignSel) !== -1) filterAssignmentSelect.value = prevAssignSel;
  }

  function placeholderFor(col){
    var L = LABELS[labelMode];
    if(col === "start" || col === "end") return "click to set";
    if(col === "cls") return L.clsPlaceholder;
    if(col === "assignment") return L.assignmentPlaceholder;
    return "notes";
  }

  function render(preserveScroll){
    var scrollPos = preserveScroll ? tableScroll.scrollTop : 0;
    tbody.innerHTML = "";
    emptyState.style.display = data.length ? "none" : "block";

    data.forEach(function(row, i){
      var tr = document.createElement("tr");

      // delete button
      var tdDel = document.createElement("td");
      tdDel.className = "col-del";
      var delBtn = document.createElement("button");
      delBtn.className = "danger-text";
      delBtn.title = "Delete row";
      delBtn.textContent = "\u00D7";
      delBtn.addEventListener("click", function(){
        data.splice(i, 1);
        saveToStorage();
        render(true);
      });
      tdDel.appendChild(delBtn);
      tr.appendChild(tdDel);

      // start / end (contenteditable, time-styled)
      ["start","end"].forEach(function(col){
        var td = document.createElement("td");
        td.className = "time-col";
        td.appendChild(makeEditableCell(row, i, col));
        tr.appendChild(td);
      });

      // class (input + datalist)
      var tdCls = document.createElement("td");
      tdCls.appendChild(makeDatalistCell(row, i, "cls", "classesList"));
      tr.appendChild(tdCls);

      // assignment (input + datalist)
      var tdAssign = document.createElement("td");
      tdAssign.appendChild(makeDatalistCell(row, i, "assignment", "assignmentsList"));
      tr.appendChild(tdAssign);

      // notes (contenteditable)
      var tdNotes = document.createElement("td");
      tdNotes.appendChild(makeEditableCell(row, i, "notes"));
      tr.appendChild(tdNotes);

      tbody.appendChild(tr);
    });

    refreshAuxLists();
    rowCountEl.textContent = data.length + (data.length === 1 ? " row" : " rows");
    tableScroll.scrollTop = scrollPos;
  }

  function makeEditableCell(row, i, col){
    var div = document.createElement("div");
    div.className = "cell";
    div.contentEditable = "true";
    div.setAttribute("data-placeholder", placeholderFor(col));
    div.textContent = row[col] || "";
    if(!row[col]) div.classList.add("empty");

    div.addEventListener("focus", function(){
      lastFocused = {rowIndex:i, col:col};
    });
    div.addEventListener("input", function(){
      div.classList.toggle("empty", div.textContent.trim() === "");
    });
    div.addEventListener("blur", function(){
      row[col] = div.textContent.trim();
      div.classList.toggle("empty", row[col] === "");
      saveToStorage();
    });
    div.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        div.blur();
      }
    });
    return div;
  }

  function makeDatalistCell(row, i, col, listId){
    var input = document.createElement("input");
    input.className = "class-input";
    input.setAttribute("list", listId);
    input.setAttribute("placeholder", placeholderFor(col));
    input.value = row[col] || "";
    input.addEventListener("focus", function(){ lastFocused = {rowIndex:i, col:col}; });
    function commit(){
      row[col] = input.value.trim();
      saveToStorage();
      refreshAuxLists();
    }
    input.addEventListener("change", commit);
    input.addEventListener("blur", commit);
    return input;
  }

  // ---------- toolbar actions ----------

  document.getElementById("btnAddRow").addEventListener("click", function(){
    data.push({start:"", end:"", cls:"", assignment:"", notes:""});
    saveToStorage();
    render(true);
    tableScroll.scrollTop = tableScroll.scrollHeight;
    var rows = tbody.querySelectorAll("tr");
    var lastRow = rows[rows.length - 1];
    if(lastRow){
      var cell = lastRow.querySelectorAll(".cell")[0];
      if(cell) cell.focus();
    }
  });

  document.getElementById("btnInsertNow").addEventListener("click", function(){
    var now = formatNow();
    if(!lastFocused || !data[lastFocused.rowIndex]){
      data.push({start:now, end:"", cls:"", assignment:"", notes:""});
      saveToStorage();
      render(true);
      tableScroll.scrollTop = tableScroll.scrollHeight;
      return;
    }
    data[lastFocused.rowIndex][lastFocused.col] = now;
    saveToStorage();
    render(true);
  });

  document.getElementById("btnBackup").addEventListener("click", function(){
    downloadCsv();
  });

  document.getElementById("btnLoadCsv").addEventListener("click", function(){
    fileInput.value = "";
    fileInput.click();
  });

  fileInput.addEventListener("change", function(){
    var file = fileInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var rows = parseCsv(String(e.target.result));
        if(!rows.length){
          alert("That CSV file did not contain any rows.");
          return;
        }
        var start = 0;
        var first = rows[0].map(function(s){ return s.trim().toLowerCase(); });
        if(first[0] === "start time" || first[0] === "start"){ start = 1; }

        var imported = [];
        for(var r = start; r < rows.length; r++){
          var cols = rows[r];
          if(cols.length === 1 && cols[0].trim() === "") continue;
          imported.push({
            start: cols[0] || "",
            end: cols[1] || "",
            cls: cols[2] || "",
            assignment: cols[3] || "",
            notes: cols[4] || ""
          });
        }
        data = imported;
        saveToStorage();
        render(false);
        tableScroll.scrollTop = 0;
        statusText.textContent = "Restored from " + file.name;
      }catch(err){
        alert("Could not read that CSV file. Please check its formatting.");
      }
    };
    reader.readAsText(file);
  });

  // ---------- summary / time spent ----------

  function tryParseDate(str){
    if(!str) return null;
    var s = str.trim();
    if(!s) return null;
    var t = Date.parse(s);
    if(!isNaN(t)) return new Date(t);
    // try "YYYY-MM-DD HH:MM" style with a space instead of T
    var alt = s.replace(" ", "T");
    t = Date.parse(alt);
    if(!isNaN(t)) return new Date(t);
    return null;
  }

  document.getElementById("btnCalc").addEventListener("click", function(){
    var selCls = filterClassSelect.value;
    var selAssign = filterAssignmentSelect.value;
    var L = LABELS[labelMode];

    if(!selCls && !selAssign){
      summaryResult.innerHTML = 'Pick a ' + L.filterClsLabel.toLowerCase() + ' and/or an ' +
        L.filterAssignmentLabel.toLowerCase() + ' above, then calculate.';
      return;
    }

    var matched = data.filter(function(row){
      if(selCls && (row.cls||"").trim() !== selCls) return false;
      if(selAssign && (row.assignment||"").trim() !== selAssign) return false;
      return true;
    });

    var totalMs = 0;
    var counted = 0;
    var skipped = 0;

    matched.forEach(function(row){
      var s = tryParseDate(row.start);
      var e = tryParseDate(row.end);
      if(!s || !e || e.getTime() <= s.getTime()){
        skipped++;
        return;
      }
      totalMs += (e.getTime() - s.getTime());
      counted++;
    });

    var totalMinutes = Math.round(totalMs / 60000);
    var hrs = Math.floor(totalMinutes / 60);
    var mins = totalMinutes % 60;

    var what = [];
    if(selCls) what.push(L.filterClsLabel + ' "' + selCls + '"');
    if(selAssign) what.push(L.filterAssignmentLabel + ' "' + selAssign + '"');

    var html = '<span class="big">' + hrs + ' hr ' + mins + ' min</span>';
    html += counted + ' of ' + matched.length + ' matching ' + (matched.length === 1 ? 'entry' : 'entries') +
            ' for ' + what.join(" + ") + '.';
    if(skipped){
      html += '<div class="note">' + skipped + ' matching ' + (skipped === 1 ? 'entry has' : 'entries have') +
              ' start/end times that could not be read as full dates, so they were left out of the total.</div>';
    }
    summaryResult.innerHTML = html;
  });

  // ---------- CSV helpers ----------

  function csvEscape(value){
    var s = (value === undefined || value === null) ? "" : String(value);
    if(/[",\n]/.test(s)){
      s = '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function downloadCsv(){
    var header = ["Start Time","End Time","Class","Assignment","Notes"];
    var lines = [header.map(csvEscape).join(",")];
    data.forEach(function(row){
      lines.push(COLUMNS.map(function(c){ return csvEscape(row[c]); }).join(","));
    });
    var csvContent = lines.join("\r\n");
    var blob = new Blob([csvContent], {type:"text/csv;charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var filename = "worklog_backup_" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + ".csv";
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    statusText.textContent = "Backed up as " + filename;
  }

  // simple RFC4180-ish CSV parser: handles quoted fields, commas, escaped quotes, CRLF/LF
  function parseCsv(text){
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    var i = 0;
    var n = text.length;

    while(i < n){
      var c = text[i];

      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }else{
        if(c === '"'){ inQuotes = true; i++; continue; }
        if(c === ','){ row.push(field); field = ""; i++; continue; }
        if(c === '\r'){ i++; continue; }
        if(c === '\n'){
          row.push(field); field = "";
          rows.push(row); row = [];
          i++; continue;
        }
        field += c; i++; continue;
      }
    }
    if(field.length || row.length){
      row.push(field);
      rows.push(row);
    }
    while(rows.length && rows[rows.length-1].every(function(f){ return f.trim() === ""; })){
      rows.pop();
    }
    return rows;
  }

  // ---------- init ----------

  labelMode = loadLabelMode();
  applyLabels();
  loadUser();
  data = loadFromStorage();
  render(false);
  tableScroll.scrollTop = 0;
})();
</script>
